name: Live Glowmarkt contract

on:
  workflow_dispatch:
  push:
    branches:
      - improve/operational-resilience

permissions:
  contents: read

jobs:
  live:
    name: Live API contract test
    runs-on: ubuntu-latest
    environment: glow-live
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify protected live Glowmarkt contract
        env:
          GLOWMARKT_USERNAME: ${{ secrets.GLOWMARKT_USERNAME }}
          GLOWMARKT_PASSWORD: ${{ secrets.GLOWMARKT_PASSWORD }}
        run: pytest -m live tests/live
